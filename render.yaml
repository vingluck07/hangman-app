# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hangman-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: games are stored in memory, so every request
    # must reach the same process. Threads handle concurrent players.
    startCommand: gunicorn server:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LOG_LEVEL
        value: INFO
